<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Administración</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="contenedor-principal">
    <div class="ticket-header">
      <span class="eyebrow">RestoApp · Admin</span>
      <h2>Productos</h2>
    </div>

    <nav class="tabs">
      <a href="index.html">Inicio</a>
      <a href="pedido.html">Pedido</a>
      <a href="admin.html" class="activa">Productos</a>
      <a href="ordenes.html">Pedidos</a>
    </nav>

    <div class="panel">
      <span class="etiqueta">Crear producto</span>
      <div class="item">
        <span class="etiqueta">Nombre</span>
        <input type="text" id="nombre">
      </div>
      <div class="item">
        <span class="etiqueta">Precio</span>
        <input type="number" id="precioNuevo" min="0" step="0.01">
      </div>
      <button id="btnCrear">Crear producto</button>
      <div id="prodMsg" class="mensaje"></div>
    </div>

    <div class="panel" style="border-top: 1px dashed var(--borde);">
      <span class="etiqueta">Menú actual</span>
      <div id="listaMenu" class="lista-admin"></div>
    </div>

    <div class="pie">
      <span>Sesión de administrador activa</span>
      <button id="btnLogout" class="secundario">Cerrar sesión</button>
    </div>
  </div>

  <script type="module" src="adminPage.js"></script>
</body>
</html>
